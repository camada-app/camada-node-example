name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
        with: { path: camada-node-example }
      - uses: actions/checkout@v4
        with: { repository: ${{ github.repository_owner }}/camada-core, path: camada-core }
      - uses: actions/checkout@v4
        with: { repository: ${{ github.repository_owner }}/camada-browser, path: camada-browser }
      - uses: actions/checkout@v4
        with: { repository: ${{ github.repository_owner }}/camada-node, path: camada-node }
      - uses: actions/setup-node@v4
        with: { node-version: ${{ matrix.node }} }
      - run: npm install && npm run build
        working-directory: camada-core
      - run: npm install && npm run build
        working-directory: camada-browser
      - run: npm install && npm run build
        working-directory: camada-node
      - run: npm install
        working-directory: camada-node-example
      - run: node --check server.js
        working-directory: camada-node-example
